<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Spotify Canvas — Now Playing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Phone frame (desktop view) / full-bleed on mobile -->
  <div class="phone" id="phone">

    <!-- ===== LAYER 1: CANVAS VIDEO (BACKGROUND) ===== -->
    <div class="layer canvas-layer" id="canvasLayer">
      <video
        id="canvasVideo"
        class="canvas-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        crossorigin="anonymous"
      ></video>
      <div class="canvas-loading" id="canvasLoading">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- ===== LAYER 2: YOUTUBE FALLBACK ===== -->
    <div class="layer youtube-layer" id="youtubeLayer" aria-hidden="true">
      <div class="youtube-wrapper" id="youtubeWrapper">
        <!-- iframe injected by JS -->
      </div>
    </div>

    <!-- ===== LAYER 2.5: ALBUM ART (shown when user toggles to cover mode) ===== -->
    <div class="layer cover-layer" id="coverLayer" aria-hidden="true">
      <img id="coverArt" class="cover-art" alt="Album cover" />
    </div>

    <!-- ===== DARK GRADIENT OVERLAY for readability ===== -->
    <div class="gradient-overlay"></div>

    <!-- ===== LAYER 3: GLASSMORPHIC UI CONTROLS ===== -->
    <div class="layer ui-layer">

      <!-- Top bar: device & canvas badge -->
      <div class="top-bar">
        <div class="chev-down">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
        </div>
        <div class="top-title">
          <span class="device-label">Cihaz</span>
          <span class="device-name">Bu Web Tarayıcısı</span>
        </div>
        <div class="more-dots">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </div>
      </div>

      <!-- Canvas / Cover toggle pill (center-right, Spotify-style) -->
      <button class="canvas-toggle" id="canvasToggle" aria-label="Canvas ve kapak arasında geçiş yap">
        <div class="toggle-icon">
          <svg class="icon-canvas" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M4 4h16v16H4z" opacity="0"/><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
          <svg class="icon-disc" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
        </div>
        <span class="toggle-text" id="toggleText">Canvas</span>
      </button>

      <!-- Bottom card: track info, actions, progress, controls -->
      <div class="bottom-card">

        <!-- Track info -->
        <div class="track-info">
          <div class="track-meta">
            <h1 class="track-title" id="trackTitle">—</h1>
            <p class="track-artist" id="trackArtist">—</p>
          </div>
          <button class="heart-btn" id="heartBtn" aria-label="Beğen">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
        </div>

        <!-- Progress -->
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-thumb" id="progressThumb"></div>
          </div>
          <div class="progress-times">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
          </div>
        </div>

        <!-- Main controls -->
        <div class="controls">
          <button class="ctrl-btn" aria-label="Karıştır">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M16.5 3a4.5 4.5 0 0 1 4.5 4.5M3 18V6m18 12v-4.5M3 18h3.26a6 6 0 0 0 4.7-2.27l4.63-5.46A6 6 0 0 1 20.34 6M21 18l-3-3m3 3-3 3M3 6l3 3m-3-3 3-3"/></svg>
          </button>
          <button class="ctrl-btn" aria-label="Önceki">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button class="ctrl-btn play-btn" id="playBtn" aria-label="Oynat/Duraklat">
            <svg id="playIcon" viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" width="36" height="36" fill="currentColor" style="display:none"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
          </button>
          <button class="ctrl-btn" aria-label="Sonraki">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M16 6h2v12h-2zm-2.5 6L5 6v12z"/></svg>
          </button>
          <button class="ctrl-btn" aria-label="Tekrar">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
          </button>
        </div>

        <!-- Bottom row: device queue share -->
        <div class="bottom-actions">
          <button class="ctrl-btn small" aria-label="Cihaz bağla">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17 1H7a2 2 0 0 0-2 2v18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2m-5 21a1 1 0 1 1 1-1 1 1 0 0 1-1 1m5-4H7V4h10z"/></svg>
          </button>
          <button class="ctrl-btn small" aria-label="Kuyruk">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm12 0v-5l5 2.5z"/></svg>
          </button>
          <button class="ctrl-btn small" aria-label="Paylaş">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </button>
        </div>

        <!-- Home indicator (iOS style) -->
        <div class="home-indicator"></div>
      </div>
    </div>

    <!-- Canvas status badge (temporary notifications) -->
    <div class="toast" id="toast"></div>
  </div>

  <!-- Demo track picker (for testing without API clients) -->
  <div class="demo-bar">
    <label for="trackInput">Track ID:</label>
    <input type="text" id="trackInput" value="3OHfY25tqY28d16oZczHc8" placeholder="Spotify Track ID" />
    <button id="loadBtn" class="load-btn">Yükle</button>
    <select id="presetSelect" class="load-btn" style="background:rgba(255,255,255,0.08);color:#fff;padding:7px 10px">
      <option value="3OHfY25tqY28d16oZczHc8">Kill Bill — SZA (Canvas var)</option>
      <option value="4cOdK2wGLETKBW3PvgPWqT">Blinding Lights (YT Fallback)</option>
      <option value="0VjIjW4GlUZAMYd2vXMi3b">Shape of You (YT Fallback)</option>
    </select>
    <span class="api-info" id="apiInfo"></span>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
